title: Keeping Up with the Capital
tagline: Weekly VC updates with an India focus
description: >-
  Weekly notes on venture capital and startups for enthusiasts, with a focus on India.
  What the money is telling us, from Silicon Valley to India, Inc.
url: https://pgwrites.github.io
baseurl: /keeping-up-with-the-capital
lang: en_IN
timezone: Asia/Kolkata
author:
  name: Payal Gusain
  url: https://www.linkedin.com/in/payalgusain
logo: /assets/img/logo.png

# Each edition lives in _posts/ as YYYY-MM-DD-short-slug.md
permalink: /editions/:year-:month-:day-:title/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  smart_quotes: ["apos", "apos", "quot", "quot"]

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: feed.xml

# Memory pages: one file per entity in _memory/, created only once the
# entity has appeared in two or more editions (see STYLE.md).
collections:
  memory:
    output: true
    permalink: /memory/:name/

defaults:
  # Share card shown when any page is linked on LinkedIn, X, WhatsApp, Slack
  - scope:
      path: ""
    values:
      image: /assets/img/share-card.png
  - scope:
      path: ""
      type: posts
    values:
      layout: edition
  - scope:
      path: ""
      type: memory
    values:
      layout: memory

exclude:
  - README.md
  - STYLE.md
  - CLAUDE.md
  - drafts/
